name: PM FAST-01 exact missing tarballs
on:
  push:
    branches: [qa/acc-core-delivery-20260911]
    paths: [.github/workflows/pm-fast01-exact-tarballs.yml]
permissions: {}
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Download only the four exact publicly published dependency versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir evidence
          cd evidence
          for entry in 'update-browserslist-db/1.3.2' 'baseline-browser-mapping/2.11.21' 'nanoid/3.3.18' 'electron-to-chromium/1.5.425'; do
            name="${entry%/*}"; version="${entry#*/}"
            curl --fail --location --max-time 40 "https://registry.npmjs.org/$name/-/$name-$version.tgz" -o "$name-$version.tgz"
          done
          sha256sum *.tgz > hashes.txt
          echo 'PM will validate each tarball against the delivered lockfile SRI before offline install. No app code executed, no branch ref updated.' > SCOPE.txt
      - name: Export exact dependency bytes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pm-fast01-exact-tarballs
          path: evidence/
          retention-days: 2
          if-no-files-found: error

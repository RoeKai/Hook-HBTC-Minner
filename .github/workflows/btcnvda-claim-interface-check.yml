name: BTCNVDA claim interface check
on:
  push:
    branches: [research/btcnvda-readonly-20260910]
    paths: [.github/workflows/btcnvda-claim-interface-check.yml]
permissions: {}
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch referenced public resources without executing code
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,re,json,hashlib,pathlib,datetime,time
          out=pathlib.Path('evidence');out.mkdir();rows=[];seen=set()
          queue=['https://btcnvda.com/assets/claim-core.mjs','https://bsptreasury.com/protocol/','https://robinhoodchain.blockscout.com/api/v2/smart-contracts/0x541c980ed3e0b5ced0bde5352c32bdab9d26a0cc','https://robinhoodchain.blockscout.com/api/v2/smart-contracts/0x6b9e91b781f24dd3f374ec9008017e6328757e71']
          while queue and len(seen)<12:
              u=queue.pop(0)
              if u in seen:continue
              seen.add(u);label='resource-'+str(len(seen));r={'url':u,'label':label,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(u,headers={'User-Agent':'PublicInterfaceResearch/1.0'})
                  with urllib.request.urlopen(req,timeout=12) as f:raw=f.read(1000001);r.update(status=f.status,contentType=f.headers.get('Content-Type',''))
                  if len(raw)>1000000:raise ValueError('too large')
                  r.update(size=len(raw),sha256=hashlib.sha256(raw).hexdigest());out.joinpath(label+'.raw').write_bytes(raw);t=raw.decode('utf-8',errors='replace')
                  if 'claim-core.mjs' in u:r['code']=t
                  elif '/api/v2/' in u:
                      d=json.loads(t);r['verification']={k:d.get(k) for k in ['is_verified','name','compiler_version','abi','source_code']}
                  else:
                      lines=t.splitlines();terms=r'源码|原始|ABI|BTCStockMiner|辅助|未公开|source|createMiner|\.sol|\.zip|\.md|resources|technical|开源'
                      matches=[i for i,x in enumerate(lines) if re.search(terms,x,re.I)]
                      indices=sorted({j for i in matches for j in range(max(0,i-1),min(len(lines),i+2))})
                      r['relevantLines']=[{'line':j+1,'text':lines[j][:2500]} for j in indices][:70]
                      for ref in re.findall(r'''href=["']([^"']+)["']''',t):
                          v=urllib.parse.urljoin(u,ref);p=urllib.parse.urlsplit(v)
                          if p.scheme=='https' and p.netloc in {'btcnvda.com','bsptreasury.com'} and re.search(r'whitepaper|roadmap|\.md$|\.sol$|\.json$|\.zip$|\.pdf$',p.path,re.I):
                              if v not in queue and v not in seen:queue.append(v)
              except urllib.error.HTTPError as e:r.update(status=e.code,error=str(e))
              except Exception as e:r.update(error=str(e))
              rows.append(r);print('INTERFACE_EVIDENCE='+json.dumps(r,ensure_ascii=False),flush=True);out.joinpath('index.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2));time.sleep(.15)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: btcnvda-claim-interface-check
          path: evidence/
          retention-days: 7
          if-no-files-found: error

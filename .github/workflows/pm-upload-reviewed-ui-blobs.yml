name: Upload PM-reviewed UI blobs only
on:
  push:
    branches: [qa/acc-core-delivery-20260911]
    paths: [.github/workflows/pm-upload-reviewed-ui-blobs.yml]
permissions: {}
jobs:
  upload:
    if: github.repository == 'RoeKai/Hook-HBTC-Minner' && github.ref == 'refs/heads/qa/acc-core-delivery-20260911'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: write
    steps:
      - name: Upload exact reviewed artifact files as unattached Git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, urllib.parse, os, json, hashlib, zipfile, io, base64
          # This isolated job never checks out or executes application code and never changes a ref.
          # Token is used only for the fixed GitHub API repository. Redirected download has no token.
          API='https://api.github.com/repos/RoeKai/Hook-HBTC-Minner'
          EXPECTED_ZIP='5d7cfaabef13e7ca1afba7a40eb091c5a19b25ece7ca3e75cbbb1d43f943e9c2'
          EXPECTED_PATCH='91daefdd7e0a6894ca56fa9001819f86491a821a0e73c13480591bdf2600600b'
          EXPECTED={
            'src/App.tsx':'761542c994f5aef8b9d946889839a87e9af13795',
            'src/components/AccumulationPreview.test.tsx':'71f178d9f40a2f870cc6ad8e9976e73aab7f344e',
            'src/components/AccumulationPreview.tsx':'371d6791b35ed11b4e1087ed9704809f5a861493',
            'src/core/accumulation-preview.test.ts':'f9e60adc15c220526bdd5156feedf35138e1dca4',
            'src/core/accumulation-preview.ts':'bad33213bcff20c297048d7a09aeba7a490c4b2c',
            'src/core/accumulation.test.ts':'5355cd3a72ec6034258c2cee93f3a2403ef48c63',
            'src/core/accumulation.ts':'3ed9e23d003a902aa9972389e6d6acfdcd7cd085',
            'src/styles.css':'2a42ca9d7253763dcd03967e9c6e1837571a2296',
          }
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(NoRedirect())
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','User-Agent':'PM-reviewed-blob-upload','X-GitHub-Api-Version':'2022-11-28'}
          def api(path,data=None):
              assert path.startswith('/actions/') or path=='/git/blobs'
              body=None if data is None else json.dumps(data).encode()
              req=urllib.request.Request(API+path,data=body,headers=headers)
              with opener.open(req,timeout=25) as r:return json.load(r)
          run=api('/actions/runs/34547091686')
          assert run['conclusion']=='success' and run['head_sha']=='d68115f4ca42c19739c8107d038d8fa8a051701b'
          req=urllib.request.Request(API+'/actions/artifacts/10179409621/zip',headers=headers)
          try:
              with opener.open(req,timeout=25) as r: blob=r.read(2000001)
          except urllib.error.HTTPError as e:
              assert e.code in (302,303,307)
              link=e.headers['Location'];u=urllib.parse.urlparse(link)
              assert u.scheme=='https' and u.hostname and (u.hostname.endswith('.blob.core.windows.net') or u.hostname.endswith('.githubusercontent.com') or u.hostname.endswith('.actions.githubusercontent.com'))
              with urllib.request.urlopen(urllib.request.Request(link,headers={'User-Agent':'PM-reviewed-blob-download'}),timeout=25) as r:blob=r.read(2000001)
          assert len(blob)<=2000000 and hashlib.sha256(blob).hexdigest()==EXPECTED_ZIP
          z=zipfile.ZipFile(io.BytesIO(blob))
          assert hashlib.sha256(z.read('patch.diff')).hexdigest()==EXPECTED_PATCH
          meta=json.loads(z.read('integrity.json'))
          assert meta['base']=='d4072fd23924d1ccd842e3ddc166abc7c1463089' and meta['blobs']==EXPECTED
          tests=json.loads(z.read('developer-results.json'))
          assert tests['success'] and tests['numPassedTests']==149 and tests['numFailedTests']==0
          verified={}
          for path,expected in EXPECTED.items():
              data=z.read('source/'+path)
              assert len(data)<50000 and '\ufffd' not in data.decode('utf-8')
              actual=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual==expected
              verified[path]=data
          output={}
          for path,data in verified.items():
              result=api('/git/blobs',{'encoding':'base64','content':base64.b64encode(data).decode()})
              assert result['sha']==EXPECTED[path]
              output[path]=result['sha']
          print('REVIEWED_BLOBS_JSON='+json.dumps({'sourceRun':34547091686,'artifact':10179409621,'blobs':output,'refsChanged':False},sort_keys=True))
          PY

name: PM isolated toolchain download
on:
  push:
    branches: [qa/live-miner-toolchain-20260911]
    paths: [.github/workflows/pm-live-miner-toolchain.yml]
permissions: {}
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Download official pinned binaries without running application or blockchain calls
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,pathlib,hashlib
          out=pathlib.Path('tools');out.mkdir()
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'PM-Independent-Review/1.0'})
              with urllib.request.urlopen(req,timeout=60) as r:return r.read(120000000)
          url='https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.26+commit.8a97fa7a'
          raw=get(url);h=hashlib.sha256(raw).hexdigest();assert h=='d5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef',h
          (out/'solc-0.8.26').write_bytes(raw)
          release=json.loads(get('https://api.github.com/repos/foundry-rs/foundry/releases/tags/v1.5.1'))
          asset=next(a for a in release['assets'] if a['name']=='foundry_v1.5.1_linux_amd64.tar.gz')
          digest=asset.get('digest');assert digest and digest.startswith('sha256:'),'Official asset digest missing'
          raw=get(asset['browser_download_url']);actual=hashlib.sha256(raw).hexdigest();assert digest=='sha256:'+actual
          (out/asset['name']).write_bytes(raw)
          (out/'verification.json').write_text(json.dumps({'scope':'Download official pinned tools only; no candidate code or chain calls','solc':{'url':url,'sha256':h},'foundry':{'url':asset['browser_download_url'],'sha256':actual,'officialDigest':digest}},indent=2))
          print((out/'verification.json').read_text())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pm-live-miner-toolchain
          path: tools/
          retention-days: 2
          if-no-files-found: error

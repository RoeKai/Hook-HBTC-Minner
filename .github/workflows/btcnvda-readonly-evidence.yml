name: BTCNVDA read-only evidence
on:
  push:
    branches: [research/btcnvda-readonly-20260910]
    paths: [.github/workflows/btcnvda-readonly-evidence.yml]
permissions: {}
concurrency:
  group: btcnvda-readonly-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Recover public source metadata and freeze bytecode evidence
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.parse,urllib.error,json,hashlib,datetime,re,time,pathlib
          OUT=pathlib.Path('evidence');OUT.mkdir(exist_ok=True)
          ALLOWED={'btcnvda.com','bsptreasury.com','robinhoodchain.blockscout.com','rpc.mainnet.chain.robinhood.com','sourcify.dev','ipfs.io','cloudflare-ipfs.com'}
          events=[]
          def emit(kind,**data):
              x={'kind':kind,**data};events.append(x);print('EVIDENCE_JSON='+json.dumps(x,ensure_ascii=False),flush=True)
              (OUT/'events.json').write_text(json.dumps(events,ensure_ascii=False,indent=2))
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  p=urllib.parse.urlparse(newurl)
                  if p.scheme!='https' or p.hostname not in ALLOWED:raise ValueError('Redirect outside public scope')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(Redirect())
          def get(url,label,timeout=15):
              try:
                  p=urllib.parse.urlparse(url)
                  assert p.scheme=='https' and p.hostname in ALLOWED
                  req=urllib.request.Request(url,headers={'User-Agent':'ReadOnlyProjectResearch/1.0','Accept-Encoding':'identity'})
                  with opener.open(req,timeout=timeout) as r:raw=r.read(2000001);status=r.status
                  if len(raw)>2000000:raise ValueError('Size cap')
                  (OUT/(label+'.txt')).write_bytes(raw)
                  emit('http',url=url,label=label,status=status,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                  try:return json.loads(raw)
                  except:return raw.decode('utf-8','replace')
              except urllib.error.HTTPError as e:emit('http-error',url=url,status=e.code,body=e.read(300).decode('utf-8','replace'));return None
              except Exception as e:emit('read-error',url=url,error=str(e));return None
          def rpc(method,params):
              assert method in {'eth_chainId','eth_getBlockByNumber','eth_getCode'}
              try:
                  req=urllib.request.Request('https://rpc.mainnet.chain.robinhood.com',data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode(),headers={'Content-Type':'application/json','User-Agent':'ReadOnlyProjectResearch/1.0'})
                  with opener.open(req,timeout=15) as r:d=json.load(r)
                  time.sleep(.25);return d
              except Exception as e:return {'error':str(e)}
          def cbor(data,i=0):
              start=i;b=data[i];i+=1;major=b>>5;n=b&31
              if n>=24:
                  size={24:1,25:2,26:4,27:8}.get(n)
                  if not size:raise ValueError('Indefinite CBOR unsupported')
                  n=int.from_bytes(data[i:i+size],'big');i+=size
              if major==0:return n,i
              if major in (2,3):
                  v=data[i:i+n];return (v if major==2 else v.decode()),i+n
              if major==5:
                  out={}
                  for _ in range(n):k,i=cbor(data,i);v,i=cbor(data,i);out[k]=v
                  return out,i
              raise ValueError('CBOR type unsupported at '+str(start))
          def b58(data):
              chars='123456789ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz';n=int.from_bytes(data,'big');s=''
              while n:n,r=divmod(n,58);s=chars[r]+s
              return '1'*(len(data)-len(data.lstrip(b'\0')))+s
          emit('scope',utc=datetime.datetime.now(datetime.timezone.utc).isoformat(),note='Public HTTP GET, read-only RPC, no account connection, no signatures, no broadcasts, no installed project code execution. Metadata is untrusted data.')
          chain=rpc('eth_chainId',[]);b=rpc('eth_getBlockByNumber',['latest',False]);block=b.get('result');tag=block['number'] if block else None
          emit('block',chain=chain,block={k:block.get(k) for k in ['number','hash','timestamp']} if block else b)
          addresses={'hook':'0x541c980ed3e0b5ced0bde5352c32bdab9d26a0cc','token':'0xdd83f3bb1539f52778314b018c401c0efe3e617f','miner':'0x6b9e91b781f24dd3f374ec9008017e6328757e71','factory':'0x3f6f537a565581b21d44ae928db438d7220e886e'}
          for name,a in addresses.items():
              d=get('https://robinhoodchain.blockscout.com/api/v2/smart-contracts/'+a,name+'-explorer')
              if isinstance(d,dict):
                  emit('verification',name=name,address=a,keys=list(d),metadata={k:d.get(k) for k in ['name','is_verified','compiler_version','language','file_path','proxy_type','implementations']},abi=d.get('abi'),source_bytes=len(d.get('source_code') or ''),additional_paths=[s.get('file_path') for s in d.get('additional_sources',[])])
                  if d.get('source_code'):(OUT/(name+'.sol')).write_text(d['source_code'])
              s=get('https://sourcify.dev/server/v2/contract/4663/'+a+'?fields=all',name+'-sourcify')
              if isinstance(s,dict):emit('sourcify',name=name,match=s.get('match'),keys=list(s))
              r=rpc('eth_getCode',[a,tag]) if tag and chain.get('result')=='0x1237' else {}
              code=r.get('result') or (d.get('deployed_bytecode') if isinstance(d,dict) else None)
              if not code:emit('no-code',name=name,error=r.get('error'));continue
              (OUT/(name+'-runtime.hex')).write_text(code)
              data=bytes.fromhex(code.removeprefix('0x'));n=int.from_bytes(data[-2:],'big');tail=data[-n-2:-2] if 0<n<len(data)-2 else b''
              decoded={};cid=None
              try:
                  decoded,end=cbor(tail);assert end==len(tail)
                  if isinstance(decoded.get('ipfs'),bytes):cid=b58(decoded['ipfs'])
              except Exception as e:emit('metadata-parse-error',name=name,error=str(e),tail=data[-80:].hex())
              emit('bytecode',name=name,address=a,source='RPC' if r.get('result') else 'explorer',block=tag,bytes=len(data),sha256=hashlib.sha256(data).hexdigest(),metadata={k:(v.hex() if isinstance(v,bytes) else v) for k,v in decoded.items()},ipfs=cid,dispatch_prefix=data[:2500].hex() if name in ('miner','token') else None)
              if cid:
                  meta=get('https://ipfs.io/ipfs/'+cid,name+'-metadata',timeout=12)
                  if not isinstance(meta,dict):meta=get('https://cloudflare-ipfs.com/ipfs/'+cid,name+'-metadata-alt',timeout=12)
                  if isinstance(meta,dict):
                      emit('metadata-found',name=name,compiler=meta.get('compiler'),settings=meta.get('settings'),sources=meta.get('sources'),abi=meta.get('output',{}).get('abi'))
          for url,label in [('https://btcnvda.com/assets/protocol.json','protocol-current'),('https://bsptreasury.com/protocol/docs/whitepaper/whitepaper.en.md','whitepaper-current'),('https://bsptreasury.com/protocol/docs/roadmap/roadmap.en.md','roadmap-current')]:
              d=get(url,label)
              if isinstance(d,str):emit('source-links',url=url,links=list(dict.fromkeys(re.findall(r'https?://[^\s<>\)\"\]]+',d)))[:50],source_mentions=[l for l in d.splitlines() if any(x in l.lower() for x in ['.sol','source','github','release-candidate'])][:45])
              elif d:emit('configuration',url=url,data=d)
          emit('complete',utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
          PY
      - name: Upload public evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: btcnvda-source-metadata
          path: evidence/
          retention-days: 14

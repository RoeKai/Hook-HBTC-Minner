name: BTCNVDA read-only evidence
on:
  push:
    branches: [research/btcnvda-readonly-20260910]
    paths: [.github/workflows/btcnvda-readonly-evidence.yml]
permissions: {}
concurrency:
  group: btcnvda-readonly-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read a bounded historical event sample without changing chain state
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,json,hashlib,time,datetime
          URL='https://rpc.mainnet.chain.robinhood.com';HOOK='0x541c980ed3e0b5ced0bde5352c32bdab9d26a0cc';TAG=hex(59358960)
          def emit(kind,**data):print('EVIDENCE_JSON='+json.dumps({'kind':kind,**data}),flush=True)
          METHODS={'eth_chainId','eth_getLogs','eth_getTransactionByHash','eth_getTransactionReceipt','eth_getCode','eth_call'}
          def rpc(method,params):
              assert method in METHODS
              req=urllib.request.Request(URL,data=json.dumps({'jsonrpc':'2.0','id':1,'method':method,'params':params}).encode(),headers={'Content-Type':'application/json','User-Agent':'ReadOnlyProjectResearch/1.0'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:data=json.load(r)
                  time.sleep(.3);return data
              except Exception as e:return {'error':str(e)}
          emit('scope',note='Bounded public historical reads only; stop if public endpoint refuses access.',utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
          chain=rpc('eth_chainId',[]);emit('chain',response=chain)
          if chain.get('result')!='0x1237':raise SystemExit(0)
          topic='0x862d2ba9699aac256550b23287759d7118ed3f3b955c395c8068e5bb9e8e0cf4'
          result=rpc('eth_getLogs',[{'address':HOOK,'fromBlock':hex(59352000),'toBlock':TAG,'topics':[topic]}]);entries=result.get('result',[]);emit('work-logs',fromBlock=59352000,toBlock=59358960,events=entries,error=result.get('error'))
          if entries:
              h=entries[-1]['transactionHash'];t=rpc('eth_getTransactionByHash',[h]);r=rpc('eth_getTransactionReceipt',[h]);tx=t.get('result');receipt=r.get('result')
              emit('sample',hash=h,transaction={k:tx.get(k) for k in ['from','to','input','value','nonce','chainId','blockNumber','blockHash']} if tx else t,receipt={k:receipt.get(k) for k in ['status','blockHash','blockNumber','gasUsed','effectiveGasPrice','gasUsedForL1','l1Fee']} if receipt else r,logs=[{'address':x['address'],'topics':x['topics'],'data':x['data']} for x in receipt.get('logs',[])][:30] if receipt else [])
              if tx and tx.get('to'):
                  a=tx['to'];code=rpc('eth_getCode',[a,TAG]);v=code.get('result');emit('target-code',address=a,bytes=(len(v)-2)//2 if v else None,sha256=hashlib.sha256(bytes.fromhex(v[2:])).hexdigest() if v else None,error=code.get('error'))
                  for n,s in [('owner','8da5cb5b'),('beneficiary','38af3eed'),('hook','7f5a7c7b'),('nvda','09fe9767')]:emit('target-getter',address=a,name=n,response=rpc('eth_call',[{'to':a,'data':'0x'+s},TAG]))
          emit('complete',utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
          PY

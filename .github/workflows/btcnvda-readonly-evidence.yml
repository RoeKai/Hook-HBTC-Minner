name: BTCNVDA read-only evidence
on:
  push:
    branches: [research/btcnvda-readonly-20260910]
    paths: [.github/workflows/btcnvda-readonly-evidence.yml]
permissions: {}
concurrency:
  group: btcnvda-readonly-evidence
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read discovered public configuration and protocol documents
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, re, hashlib, datetime
          from html.parser import HTMLParser
          ALLOWED={'btcnvda.com','bsptreasury.com','robinhoodchain.blockscout.com'}
          def emit(kind,**data): print('EVIDENCE_JSON='+json.dumps({'kind':kind,**data},ensure_ascii=False),flush=True)
          class Redirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):
                  p=urllib.parse.urlparse(newurl)
                  if p.scheme!='https' or p.hostname not in ALLOWED: raise ValueError('Redirect outside scope')
                  return super().redirect_request(req,fp,code,msg,headers,newurl)
          opener=urllib.request.build_opener(Redirect())
          class Page(HTMLParser):
              def __init__(self): super().__init__();self.hidden=0;self.text=[];self.links=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag in ('script','style','noscript'): self.hidden+=1
                  if tag=='script' and a.get('src'): self.scripts.append(a['src'])
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
              def handle_endtag(self,tag):
                  if tag in ('script','style','noscript'): self.hidden=max(0,self.hidden-1)
              def handle_data(self,data):
                  if not self.hidden and data.strip(): self.text.append(data.strip())
          def get(url,mode='source'):
              try:
                  p=urllib.parse.urlparse(url)
                  if p.scheme!='https' or p.hostname not in ALLOWED: raise ValueError('Out of scope')
                  with opener.open(urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; ReadOnlyProjectResearch/1.0)','Accept-Encoding':'identity'}),timeout=25) as r:
                      raw=r.read(2000001);status=r.status;ctype=r.headers.get('Content-Type','')
                  if len(raw)>2000000: raise ValueError('Response exceeds limit')
                  text=raw.decode('utf-8','replace');emit('http',url=url,status=status,bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest(),utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
                  if 'html' in ctype or '<html' in text[:1000].lower():
                      page=Page();page.feed(text);emit('page',url=url,text='\n'.join(page.text)[:40000],links=page.links[:100],scripts=page.scripts[:20]);return text
                  if mode=='contract':
                      data=json.loads(text)
                      emit('contract',url=url,metadata={k:v for k,v in data.items() if k not in ('abi','source_code','additional_sources','creation_bytecode','deployed_bytecode','constructor_args','decoded_constructor_args')},abi=data.get('abi'),constructor=data.get('decoded_constructor_args'),additional_sources=[x.get('file_path') for x in data.get('additional_sources',[])])
                      source=data.get('source_code','') or ''
                      if source:
                          for offset in range(0,min(len(source),65000),10000): emit('source',url=url,offset=offset,text=source[offset:offset+10000])
                      return data
                  for offset in range(0,min(len(text),80000),10000):emit('source',url=url,offset=offset,text=text[offset:offset+10000])
                  if 'json' in ctype or text.startswith('{'):return json.loads(text)
                  return text
              except Exception as e:emit('error',url=url,error=type(e).__name__+': '+str(e));return None
          emit('scope',note='Phase 2: public GET only; no wallet, signing, broadcast, secrets or application code changes.')
          cfg=get('https://btcnvda.com/assets/protocol.json')
          get('https://bsptreasury.com/protocol/')
          get('https://btcnvda.com/assets/live-instance.mjs')
          get('https://btcnvda.com/assets/buy-ui.mjs')
          get('https://btcnvda.com/api/instance')
          get('https://btcnvda.com/btcnvda/dashboard.html')
          for a in ['0x541c980ed3e0b5ced0bde5352c32bdab9d26a0cc','0xDD83F3Bb1539F52778314B018C401c0EFE3e617F']:
              get('https://robinhoodchain.blockscout.com/api/v2/smart-contracts/'+a,'contract')
              get('https://robinhoodchain.blockscout.com/api/v2/addresses/'+a)
          emit('complete',utc=datetime.datetime.now(datetime.timezone.utc).isoformat())
          PY

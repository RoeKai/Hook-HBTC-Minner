name: BTCNVDA public interface refresh
on:
  push:
    branches: [research/btcnvda-readonly-20260910]
    paths: [.github/workflows/btcnvda-public-interface-refresh.yml]
permissions: {}
concurrency:
  group: btcnvda-public-interface-refresh
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read public website files and verification endpoints
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error,urllib.parse,re,json,hashlib,pathlib,datetime,time
          out=pathlib.Path('evidence');out.mkdir();rows=[];seen=set();texts={}
          origin='https://btcnvda.com'
          def get(url,label):
              row={'url':url,'label':label,'utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'PublicInterfaceResearch/1.0','Accept':'application/json,text/html,text/plain,*/*'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      raw=r.read(1000001);row.update(status=r.status,finalUrl=r.url,contentType=r.headers.get('Content-Type',''))
                  if len(raw)>1000000:raise ValueError('response exceeds bounded collection size')
                  row.update(size=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                  out.joinpath(label+'.raw').write_bytes(raw)
                  text=raw.decode('utf-8',errors='replace');texts[url]=text
                  row['relevantLines']=[x[:1500] for x in text.splitlines() if re.search(r'ABI|BTCStockMiner|createMiner|source|源码|合约|miner|claim|\.mjs|whitepaper|roadmap|href=',x,re.I)][:24]
                  if 'protocol.json' in url:row['configuration']=json.loads(text)
                  if 'sourcify' in url or '/api/v2/smart-contracts/' in url:
                      d=json.loads(text);row['verification']={k:d.get(k) for k in ['match','is_verified','name','compiler_version','abi','source_code']}
                  return text
              except urllib.error.HTTPError as e:row.update(status=e.code,error=str(e))
              except Exception as e:row.update(error=str(e))
              finally:
                  rows.append(row);print('PUBLIC_EVIDENCE='+json.dumps(row,ensure_ascii=False),flush=True)
                  out.joinpath('index.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2))
              return ''
          queue=[origin+'/',origin+'/assets/protocol.json',origin+'/assets/sites.mjs',origin+'/assets/buy-core.mjs']
          # Follow only same-origin links/imports publicly referenced in retrieved files; never execute them.
          while queue and len(seen)<14:
              u=queue.pop(0)
              if u in seen:continue
              seen.add(u);t=get(u,'website-'+str(len(seen)))
              refs=re.findall(r'''(?:href|src)=["']([^"']+)|(?:from\s*|import\s*)["']([^"']+)|["']((?:\./|/)(?:assets|docs)/[^"']+)["']''',t)
              for hit in refs:
                  ref=next((x for x in hit if x),'');v=urllib.parse.urljoin(u,ref);p=urllib.parse.urlsplit(v)
                  if p.scheme=='https' and p.netloc=='btcnvda.com' and re.search(r'\.m?js$|\.json$|\.md$|whitepaper|roadmap|abi|\.sol$',p.path,re.I):
                      if v not in seen and v not in queue:queue.append(v)
              time.sleep(.15)
          for name,a in [('hook','0x541c980ed3e0b5ced0bde5352c32bdab9d26a0cc'),('miner','0x6b9e91b781f24dd3f374ec9008017e6328757e71')]:
              get('https://sourcify.dev/server/v2/contract/4663/'+a+'?fields=all','sourcify-'+name)
          get('https://ipfs.io/ipfs/QmVRktFxhTvHJkcVD5Hy1ZkgTz3S4D97Kj4WYMuSjuuxG6','miner-ipfs-metadata')
          print('PUBLIC_SUMMARY='+json.dumps({'retrieved':len(rows),'websiteUrls':list(texts),'note':'HTTP public reads only. No wallets, keys, transactions, application changes, or proof of complete source recovery.'},ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: btcnvda-public-interface-refresh
          path: evidence/
          retention-days: 7
          if-no-files-found: error
